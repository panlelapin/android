name: Update the Pan le lapin repository
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
concurrency:
  group: publish-fdroid
  cancel-in-progress: false
permissions: {}
jobs:
  index:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      updated: ${{ steps.collect.outputs.changed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: master
      - run: python3 -B -m unittest discover -s catalog
      - name: Collect new signed APKs
        id: collect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          extra=()
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then extra+=(--force); fi
          python3 -B catalog/importer.py "$RUNNER_TEMP/fdroid" "${extra[@]}"
      - name: Install fdroidserver
        if: steps.collect.outputs.changed == 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/fdroid-env"
          "$RUNNER_TEMP/fdroid-env/bin/pip" install 'fdroidserver==2.4.5'
          echo "$RUNNER_TEMP/fdroid-env/bin" >> "$GITHUB_PATH"
      - name: Sign and verify the index
        if: steps.collect.outputs.changed == 'true'
        env:
          INDEX_P12: ${{ secrets.FDROID_INDEX_P12_B64 }}
          INDEX_PASSWORD: ${{ secrets.FDROID_INDEX_PASSWORD }}
        run: |
          export PATH="$ANDROID_HOME/build-tools/36.0.0:$PATH"
          python -B catalog/sign_index.py "$RUNNER_TEMP/fdroid"
      - name: Commit and stage public repository assets
        if: steps.collect.outputs.changed == 'true'
        run: |
          python3 -B catalog/public_repo.py "$RUNNER_TEMP/fdroid/repo" . --replace
          python3 -B catalog/public_repo.py . "$RUNNER_TEMP/site"
          git add -u
          python3 -B -c 'from pathlib import Path; import sys, subprocess; sys.path.insert(0, "catalog"); from public_repo import public_paths; subprocess.run(["git", "add", "--", *(str(p) for p in public_paths(Path(".")))], check=True)'
          if ! git diff --cached --quiet; then
            git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m 'Update the signed repository'
            git push origin HEAD:master
          fi
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        if: steps.collect.outputs.changed == 'true'
        with:
          path: ${{ runner.temp }}/site
  pages:
    needs: index
    if: needs.index.outputs.updated == 'true'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy the F-Droid repository
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
