name: Mettre à jour Pan le lapin
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
concurrency:
  group: publish-fdroid
  cancel-in-progress: false
permissions: {}
jobs:
  index:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      updated: ${{ steps.collect.outputs.changed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - run: python3 -B -m unittest discover -s catalogue
      - name: Récupérer les APK signés manquants
        id: collect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          extra=()
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then extra+=(--force); fi
          python3 -B catalogue/importer.py "$RUNNER_TEMP/fdroid" "${extra[@]}"
      - name: Installer fdroidserver
        if: steps.collect.outputs.changed == 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/fdroid-env"
          "$RUNNER_TEMP/fdroid-env/bin/pip" install 'fdroidserver==2.4.5'
          echo "$RUNNER_TEMP/fdroid-env/bin" >> "$GITHUB_PATH"
      - name: Signer et vérifier l’index
        if: steps.collect.outputs.changed == 'true'
        env:
          INDEX_P12: ${{ secrets.FDROID_INDEX_P12_B64 }}
          INDEX_PASSWORD: ${{ secrets.FDROID_INDEX_PASSWORD }}
        run: |
          export PATH="$ANDROID_HOME/build-tools/36.0.0:$PATH"
          python -B catalogue/sign_index.py "$RUNNER_TEMP/fdroid"
      - name: Enregistrer les seuls fichiers publics
        if: steps.collect.outputs.changed == 'true'
        run: |
          rsync -r --delete "$RUNNER_TEMP/fdroid/repo/" fdroid/repo/
          git add fdroid/repo
          git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m 'Actualiser le catalogue signé'
          git push origin HEAD:main
          mkdir -p "$RUNNER_TEMP/site/fdroid"
          cp index.html "$RUNNER_TEMP/site/"
          cp -r fdroid/repo "$RUNNER_TEMP/site/fdroid/"
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        if: steps.collect.outputs.changed == 'true'
        with:
          path: ${{ runner.temp }}/site
  pages:
    needs: index
    if: needs.index.outputs.updated == 'true'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Déployer le site F-Droid
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
